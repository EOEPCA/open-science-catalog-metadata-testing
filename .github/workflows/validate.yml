name: Validate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  BUILD_STAGE: before-build
# BUILD_STAGE: after-build

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Prepare
        run: |
          cd .github/workflows/validation
          npm ci
      - name: Validate
        run: |
          cd .github/workflows/validation
          npm test
